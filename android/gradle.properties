# -Xmx reduzido de 8G para 3G: a máquina tem 23,8 GB de RAM mas costuma estar
# com pouca memória livre (observado: ~4,8 GB livres com outros programas
# abertos), e um heap de 8G para o daemon do Gradle (mais o overhead nativo de
# Kotlin/R8/AAPT2 rodando em paralelo) estava causando OutOfMemoryError e
# crash do daemon, principalmente em builds --release (usam R8).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStoreType=Windows-ROOT
android.useAndroidX=true
# O cache de pacotes Dart/Flutter (PUB_CACHE) fica na unidade E, mas o
# projeto está na unidade C. O cache incremental do Kotlin tenta calcular
# caminhos relativos entre arquivos-fonte de plugins (em E:) e o projeto
# (em C:), o que não é possível entre unidades diferentes no Windows e
# derruba o build com "this and base files have different roots". Desativar
# a compilação incremental do Kotlin evita esse caminho de código — só deixa
# rebuilds um pouco mais lentos, não afeta o resultado.
kotlin.incremental=false
